<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ikonka záložky prohlížeče — izometrická krychle ve firemní modré ALBA
       (#0083C6, Pantone 7461 C). Plná dlaždice je záměr: v 16 px drží tvar
       a vypadá stejně na světlé i tmavé liště prohlížeče, kdežto průhledné
       pozadí by nechalo tmavou stěnu splynout s tmavou lištou.
       Tři stěny se liší jen krytím bílé, takže ikonka nese jedinou barvu. -->
  <rect width="32" height="32" rx="7" fill="#0083C6"/>
  <polygon points="16,7 25,12.2 16,17.4 7,12.2" fill="#ffffff"/>
  <polygon points="7,12.2 16,17.4 16,26.5 7,21.3" fill="#ffffff" opacity=".62"/>
  <polygon points="25,12.2 16,17.4 16,26.5 25,21.3" fill="#ffffff" opacity=".82"/>
</svg>

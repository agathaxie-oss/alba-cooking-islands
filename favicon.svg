<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ikonka záložky prohlížeče — obrysová izometrická krychle ve firemní
       modré ALBA (#0083C6, Pantone 7461 C). Variantu vybral zadavatel
       3. 9. 2026; blíž technickému výkresu než plná dlaždice.
       Tah 2 jednotky ve viewBox 32 dá v 16 px přesně 1 pixel (na HiDPI dva).
       Kdo ho bude měnit: měň ho ZÁROVEŇ tady i v tools/gen-favicon-ico.py,
       jinak se SVG a .ico rozejdou. -->
  <g fill="none" stroke="#0083C6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="16,4 27,10 27,22 16,28 5,22 5,10"/>
    <path d="M5,10 L16,16 L27,10 M16,16 L16,28"/>
